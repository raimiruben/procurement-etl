[project]
name = "procurement-etl"
version = "1.0.0"
description = "ETL pipeline: ERP purchase-order exports + supplier master data + FX API -> PostgreSQL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procurement_etl"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
